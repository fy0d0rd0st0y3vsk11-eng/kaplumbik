name: Shop feature checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/shop-cosmetics-inventory-v2"]

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile Python modules
        run: python -m compileall -q app run_bot.py
      - name: Run test suite
        run: pytest -q
